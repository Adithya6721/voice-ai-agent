# ──────────────────────────────────────────────────────
# Logging configuration
# ──────────────────────────────────────────────────────

version: 1
disable_existing_loggers: false

loggers:
  voice_ai:
    level: INFO
    handlers: [console]
    propagate: false

  voice_ai.audio:
    level: DEBUG

  voice_ai.vad:
    level: DEBUG

  voice_ai.asr:
    level: DEBUG

  voice_ai.pipeline:
    level: INFO

handlers:
  console:
    class: logging.StreamHandler
    formatter: rich
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    formatter: json
    filename: logs/voice_ai.log
    maxBytes: 10485760   # 10 MB
    backupCount: 5

formatters:
  rich:
    format: "%(message)s"

  plain:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  json:
    format: '{"time":"%(asctime)s","level":"%(levelname)s","logger":"%(name)s","msg":"%(message)s"}'
